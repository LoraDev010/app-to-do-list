<ion-header>
  <ion-toolbar>
    <ion-title>Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (categoryService.categories().length === 0) {
    <app-empty-state
      icon="folder-open-outline"
      title="Sin categorías"
      subtitle="Toca + para crear tu primera categoría"
    ></app-empty-state>
  } @else {
    <ion-list>
      @for (cat of categoryService.categories(); track cat.id) {
        <ion-item-sliding>
          <ion-item lines="none" class="category-item">
            <span class="color-indicator" [style.background]="cat.color" slot="start"></span>
            <ion-label>
              <h3>{{ cat.name }}</h3>
            </ion-label>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option color="primary" (click)="openCategoryForm(cat)">
              <ion-icon slot="icon-only" name="create-outline"></ion-icon>
            </ion-item-option>
            <ion-item-option color="danger" (click)="confirmDelete(cat.id)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openCategoryForm()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

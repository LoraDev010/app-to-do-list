<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="dismiss()">Cancelar</ion-button>
    </ion-buttons>
    <ion-title>{{ isEditing ? 'Editar tarea' : 'Nueva tarea' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="primary" [disabled]="form.invalid" (click)="save()">
        Guardar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-item>
      <ion-label position="stacked">Título *</ion-label>
      <ion-input
        formControlName="title"
        placeholder="¿Qué necesitas hacer?"
        clearInput
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Categoría</ion-label>
      <ion-select formControlName="categoryId" placeholder="Sin categoría" interface="action-sheet">
        <ion-select-option [value]="null">Sin categoría</ion-select-option>
        @for (cat of categoryService.categories(); track cat.id) {
          <ion-select-option [value]="cat.id">{{ cat.name }}</ion-select-option>
        }
      </ion-select>
    </ion-item>

    @if (remoteConfig.enableTaskPriority()) {
      <ion-item>
        <ion-label position="stacked">Prioridad</ion-label>
        <ion-select formControlName="priority" placeholder="Sin prioridad" interface="action-sheet">
          <ion-select-option [value]="null">Sin prioridad</ion-select-option>
          @for (p of priorities; track p.value) {
            <ion-select-option [value]="p.value">{{ p.label }}</ion-select-option>
          }
        </ion-select>
      </ion-item>
    }
  </form>
</ion-content>
